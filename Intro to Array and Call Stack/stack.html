<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Methods of Array</h1>
    <h3>pop methods</h3>
    <p id="pop"></p>

    <h3>join methods</h3>
    <p id="join"></p>

    <script>
        var fruits = ["Apple", "Banana", "Mango", "Orange"]
        fruits.pop()
        document.getElementById("pop").innerHTML = fruits;
        document.getElementById("join").innerHTML = fruits.join("*");
    </script>
</body>
</html>
</body>
